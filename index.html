<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Home</title>
    <!-- Favicons -->
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicons/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicons/favicon-16x16.png">
    <link rel="manifest" href="./assets/favicons/site.webmanifest">
    <link rel="shortcut icon" href="./assets/favicons/favicon.ico">

    <!-- Link to the main style file -->
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/auth.css">
</head>

<body>
    <!-- Global Navigation Bar -->
    <header class="navbar">
        <div class="container nav-content">
            <a href="index.html" class="logo-section">
                <div class="logo-icon" style="background: none; box-shadow: none;">
                    <img src="./assets/favicons/android-chrome-192x192.png" alt="TaskFlow Logo"
                        style="width: 100%; height: 100%; object-fit: contain;">
                </div>
                <span class="logo-text">TaskFlow</span>
            </a>

            <nav class="nav-links">
                <a href="index.html" class="nav-link active">Home</a>
                <a href="features.html" class="nav-link">Features</a>
                <a href="about.html" class="nav-link">About</a>
                <a href="docs.html" class="nav-link">Docs</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </nav>

            <div class="nav-actions">
                <!-- Populated by auth.js based on session state -->
            </div>
        </div>
    </header>

    <!-- Main Content Area: The To-Do App -->
    <main>
        <!-- Hero Section -->
        <div class="hero-section">
            <h1 class="hero-title">
                Manage Your Tasks <br />
                <span class="text-gradient">Effortlessly</span>
            </h1>
            <p class="hero-subtitle">
                Stay organized and productive with TaskFlow. The simple, modern way to track your daily goals and get
                things done.
            </p>

            <!-- Input Form Structure -->
            <div class="task-form-container">
                <!-- We use an ID to easily select this form in Javascript -->
                <form id="todo-form" class="task-form">
                    <div class="input-group">
                        <span class="material-symbols-outlined input-icon">add_task</span>
                        <!-- The input field where users type their tasks -->
                        <input type="text" id="todo-input" class="task-input" placeholder="What needs to be done?"
                            aria-label="New task input">
                    </div>
                    <button type="submit" class="btn btn-primary btn-add">
                        <span>Add Task</span>
                        <span class="material-symbols-outlined">arrow_forward</span>
                    </button>
                </form>
            </div>
        </div>

        <!-- Task List container where tasks will be injected by JavaScript -->
        <div class="task-list-container">
            <!-- ─── Filter / Control Bar ─────────────────────────────────── -->
            <div class="filter-bar">
                <!-- Left: title + task count -->
                <div class="filter-bar-left">
                    <h2 class="list-title">
                        <span class="material-symbols-outlined text-primary">list_alt</span>
                        My Tasks
                        <span id="task-count" class="task-count-badge"></span>
                    </h2>
                </div>

                <!-- Centre: status filter pills -->
                <div class="filter-pills" id="filter-pills">
                    <button class="filter-pill active" data-filter="all" onclick="setFilter('all')">All</button>
                    <button class="filter-pill" data-filter="active" onclick="setFilter('active')">Active</button>
                    <button class="filter-pill" data-filter="completed" onclick="setFilter('completed')">Done</button>
                </div>

                <!-- Right: search + sort + clear -->
                <div class="filter-bar-right">
                    <div class="search-box">
                        <span class="material-symbols-outlined search-icon">search</span>
                        <input type="text" id="task-search" class="search-input" placeholder="Search tasks…"
                            oninput="renderTasks()">
                    </div>

                    <div class="sort-wrapper">
                        <span class="material-symbols-outlined sort-icon">sort</span>
                        <select id="task-sort" class="sort-select" onchange="renderTasks()">
                            <option value="newest">Newest</option>
                            <option value="oldest">Oldest</option>
                            <option value="az">A → Z</option>
                            <option value="za">Z → A</option>
                        </select>
                    </div>

                    <button class="btn-clear-done" id="clear-done-btn" onclick="clearCompleted()"
                        title="Remove all completed tasks">
                        <span class="material-symbols-outlined">delete_sweep</span>
                        <span>Clear done</span>
                    </button>
                </div>
            </div>

            <!-- Task List -->
            <div id="todo-list" class="task-list"></div>
        </div>
    </main>

    <!-- Global Footer -->
    <footer>
        <div class="container footer-content">
            <div class="footer-brand">
                <div class="footer-logo">
                    <span class="material-symbols-outlined text-primary">check_circle</span>
                    <span>TaskFlow</span>
                </div>
                <p class="footer-text">© 2026 TaskFlow Inc. All rights reserved.</p>
            </div>
        </div>
    </footer>

    <!-- auth.js must load before app.js so getLoggedInUser() is available -->
    <script src="./js/auth.js"></script>
    <script src="./js/app.js"></script>
</body>

</html>
